[package]
name = "vectorcraft-js"
description = "JavaScript for scripts: an ECMAScript 5.1 parser, and an interpreter with a garbage-collected heap and execution limits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
# Unicode 17.0 general categories for identifiers (chars.rs). 0.1.5 adds the Unicode-3.0 license,
# which is not on the license allowlist, so the version is exact.
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
# The seed of Math.random (interp.rs).
getrandom = "0.4"

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# The browser's crypto.getRandomValues.
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = { workspace = true }
