[package]
name = "vectorcraft-plugin-csv-rows"
description = "Example VectorCraft WebAssembly panel plug-in: CSV Rows"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not a member of the VectorCraft workspace: it builds for wasm32-unknown-unknown only.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
