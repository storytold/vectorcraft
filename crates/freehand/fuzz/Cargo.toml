[package]
name = "vectorcraft-freehand-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vectorcraft-freehand = { path = "..", features = ["synth"] }

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "synth"
path = "fuzz_targets/synth.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
