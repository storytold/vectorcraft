[package]
name = "vectorcraft-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "VectorCraft test helpers: fixtures, generators, render comparison, geometry assertions"
publish = false

[lints]
workspace = true

[dependencies]
vectorcraft-geom = { workspace = true }
vectorcraft-color = { workspace = true }
vectorcraft-doc = { workspace = true }
vectorcraft-engine = { workspace = true, features = ["bundled-fonts"] }
vectorcraft-render = { workspace = true }
vectorcraft-format = { workspace = true }
vectorcraft-svg = { workspace = true }
kurbo = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }
image = { workspace = true }
# A Group 4 encoder and the T.4 run codes, to write CCITT Group 3 TIFFs (`tiff::group3`).
fax = "0.2"
