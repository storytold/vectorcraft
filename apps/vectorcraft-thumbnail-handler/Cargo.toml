[package]
name = "vectorcraft-thumbnail-handler"
description = "Windows Explorer thumbnail handler for VectorCraft documents and templates"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# A COM server DLL that Explorer loads; on other systems it builds the parts the tests check.
[lib]
crate-type = ["cdylib"]

# PNG decoding of the picture `vectorcraft-cli thumbnail` writes. MIT OR Apache-2.0.
[dependencies]
png = "0.18"

# IThumbnailProvider, IInitializeWithStream, the class factory, DIB sections and the registry.
# MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
