[package]
name = "vectorcraft-plugin-worker"
description = "The web build's plug-in worker: checks plug-in modules being installed and runs filters off the page"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "vectorcraft-plugin-worker"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
vectorcraft-plugins = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
