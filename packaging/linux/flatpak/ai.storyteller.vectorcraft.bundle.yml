# Flatpak manifest for the single-file bundle attached to every GitHub release
# (vectorcraft-<version>-linux-<arch>.flatpak). Build it with packaging/linux/flatpak-bundle.sh.
#
# It repackages the release's own Linux tarball (vectorcraft-<version>-linux-<arch>.tar.gz,
# built on Ubuntu 22.04 by package.sh) instead of compiling Rust inside flatpak-builder: no
# network and no vendored crate sources during the build, a few seconds instead of 20+ minutes,
# and byte-for-byte the same binaries as the AppImage/deb/rpm. The script unpacks the tarball
# into `stage/` next to a copy of this file. The binaries need glibc >= 2.35 and load X11,
# Wayland, xkbcommon and Vulkan at runtime; the freedesktop runtime has all of them, and the
# GPU driver comes from its org.freedesktop.Platform.GL extension.
#
# ai.storyteller.vectorcraft.yml (same directory) is the from-source manifest for Flathub. Keep
# runtime, runtime-version, sdk and finish-args identical in both (packaging-lint checks this).
id: ai.storyteller.vectorcraft
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: vectorcraft
finish-args:
  # X11 shared memory (MIT-SHM). Without it the X11 fallback is slow or fails.
  - --share=ipc
  # Display: Wayland first; X11 only when no Wayland compositor is running.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for the wgpu renderer (Vulkan, or GL as a fallback).
  - --device=dri
  # Network for the update check against GitHub releases.
  - --share=network
  # Cursor theme: without the cursor-shape protocol (e.g. GNOME 46) winit loads the theme itself.
  # The sandbox sets no XCURSOR_PATH and ships no cursor themes, so the pointer would turn invisible
  # over the window. The host's themes are mounted under /run/host (#2450).
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  # Open/Save dialogs use the file-chooser portal (rfd), and drag-and-drop uses the document
  # portal, so broad filesystem access isn't needed. Pictures is granted for opening files by
  # path from the command line.
  - --filesystem=xdg-pictures
  # Font managers (FontBase and others) activate fonts into ~/.fonts, which Flatpak does not open
  # to a sandbox: it exposes /usr/share/fonts and ~/.local/share/fonts, and nothing else. Without
  # this the font list holds none of the activated families, while native apps see them.
  - --filesystem=~/.fonts:ro
  # Deliberately not granted: home/host filesystem access beyond the read-only folders above.
modules:
  - name: vectorcraft
    buildsystem: simple
    build-commands:
      - install -Dm755 bin/vectorcraft /app/bin/vectorcraft
      - install -Dm755 bin/vectorcraft-cli /app/bin/vectorcraft-cli
      - install -Dm644 share/applications/ai.storyteller.vectorcraft.desktop /app/share/applications/ai.storyteller.vectorcraft.desktop
      - install -Dm644 share/mime/packages/ai.storyteller.vectorcraft.xml /app/share/mime/packages/ai.storyteller.vectorcraft.xml
      # Already has the release's version and date substituted by package.sh.
      - install -Dm644 share/metainfo/ai.storyteller.vectorcraft.metainfo.xml /app/share/metainfo/ai.storyteller.vectorcraft.metainfo.xml
      - mkdir -p /app/share/icons /app/share/doc && cp -R share/icons/hicolor /app/share/icons/ && cp -R share/doc/vectorcraft /app/share/doc/
    sources:
      - type: dir
        path: stage
