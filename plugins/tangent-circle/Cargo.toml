[package]
name = "vectorcraft-plugin-tangent-circle"
description = "VectorCraft tool plug-in: snap a dragged circle to two external tangencies"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
