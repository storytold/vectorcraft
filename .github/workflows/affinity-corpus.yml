name: Affinity 3 corpus

on:
  push:
    branches: [main]
    paths: ["crates/**", "xtask/**", "Cargo.toml", "Cargo.lock", ".github/workflows/affinity-corpus.yml"]
  pull_request:
    paths: ["crates/**", "xtask/**", "Cargo.toml", "Cargo.lock", ".github/workflows/affinity-corpus.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: affinity-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affinity3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AFFINITY_CORPUS_REQUIRED: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: "1.95"
      - name: Fetch pinned and checksum-verified corpus
        run: cargo xtask corpus --affinity
      - name: Parse every file and freeze actual Affinity 3 feature retention
        run: cargo test -p vectorcraft-affinity --all-features -- --nocapture
      - name: Check every artboard, native save, SVG, PDF and PSD exports
        run: cargo test -p vectorcraft-engine --test affinity_artboards --test affinity_text --test affinity_corpus -- --nocapture
