# FreeBSD build and package check in a QEMU VM.
name: FreeBSD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "packaging/freebsd/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/freebsd.yml"
      - "packaging/freebsd/**"
      - "packaging/env.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@main
    with:
      require-craft-fonts: true
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
      run-package-check: true
