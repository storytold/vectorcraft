name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions. Every night the gate runs a cold build:
# the safety net for the workspace crates it keeps between runs (`cache-workspace-crates`), and a
# fresh start for that cache entry.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 3 * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      # The gate's test binaries carry no debug info and no symbols (CARGO_PROFILE_TEST_DEBUG=0,
      # CARGO_PROFILE_TEST_STRIP=symbols), as photocraft's do: linking ~100 test binaries with line
      # tables ran the hosted runner out of resources, and it stopped mid-link with "received a
      # shutdown signal" (exit 143). Panics still name file and line; local builds keep Cargo.toml's
      # line tables.
      dev-strip: true
      # The workspace crates also build without line tables. A panic still names its file and line.
      dev-debug: "0"
      # Five legs instead of one: shards 1 to 4 each build and run the tests of their own crates,
      # and shard 5 runs the other `cargo xtask ci` steps (xtask/src/shards.rs). `gate (<os>)`
      # passes only when all five did. On pushes to main, a `cache warm` leg builds what every
      # shard builds and saves the dependency cache.
      test-shards: 5
      shard-command: cargo xtask ci shard
      warm-command: cargo xtask ci warm
      # The dependency cache also keeps the compiled workspace crates and test executables, so a
      # pull request's shards rebuild only the crates its changes reach. Each main run's `cache
      # warm` leg saves a rolling entry of its own, every leg restores the newest one, and
      # `cache-prune` below deletes the one it replaced. The nightly run restores nothing and
      # builds everything from source.
      cache-workspace-crates: true
      cold-build: ${{ github.event_name == 'schedule' }}
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev

  # Keeps one rolling gate entry on main, so the repository stays within its 10 GB Actions cache
  # budget. It runs beside the gate and prunes each time the `cache warm` leg finishes saving. A
  # failed prune warns instead of failing the run; the next main run's prune deletes what it missed.
  cache-prune:
    name: cache prune
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Prune replaced cache entries
        uses: storytold/craft-common-actions/actions/cache-prune@main
        continue-on-error: true
        with:
          watch: true
          watch-minutes: 110
          saving-jobs: |
            ^gate( / cache warm \(.*\))?$
