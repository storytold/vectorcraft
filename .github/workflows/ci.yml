name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate runs unless a push changes only prose: a pull request (or a push to main) that touches
  # only Markdown, or a push to a pull request that changed only Markdown besides moving its base,
  # when the previous head's run passed (merging main to resolve a conflict in docs/, or any merge
  # of main that leaves the pull request's own changes as they were). If scope fails, the gate
  # runs.
  scope:
    permissions:
      contents: read
      actions: read
    uses: storytold/craft-common-actions/.github/workflows/changed-paths.yml@main
    with:
      # Markdown is prose, except ASSETS.md (`xtask assets` reads it) and packaging/ (`xtask brands`
      # scans it); everything else, docs/images/ included, runs the gate.
      paths: |
        !(*.md)
        ASSETS.md
        packaging/*
      since-passed: true

  gate:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.matched != 'false' }}
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 90
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
