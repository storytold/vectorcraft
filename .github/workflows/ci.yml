name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Same craft-fonts commit as release.yml.
      craft-fonts-ref: c1db6d1a8ed772191241c3d185e2104be84d8691
      timeout-minutes: 90
      # The gate's test binaries carry no debug info and no symbols (CARGO_PROFILE_TEST_DEBUG=0,
      # CARGO_PROFILE_TEST_STRIP=symbols), as photocraft's do: linking ~100 test binaries with line
      # tables ran the hosted runner out of resources, and it stopped mid-link with "received a
      # shutdown signal" (exit 143). Panics still name file and line; local builds keep Cargo.toml's
      # line tables.
      dev-strip: true
      # The workspace crates also build without line tables. A panic still names its file and line.
      dev-debug: "0"
      # Five legs instead of one: shards 1 to 4 each build and run the tests of their own crates,
      # and shard 5 runs the other `cargo xtask ci` steps (xtask/src/shards.rs). `gate (<os>)`
      # passes only when all five did. On pushes to main, a `cache warm` leg builds what every
      # shard builds and saves the dependency cache.
      test-shards: 5
      shard-command: cargo xtask ci shard
      warm-command: cargo xtask ci warm
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgl1-mesa-dev
