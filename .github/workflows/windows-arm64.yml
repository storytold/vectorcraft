# Windows ARM64 build and smoke test.
#
# Release packages on arm64-windows are produced on x64 runners via cross-compilation
# (target: aarch64-pc-windows-msvc) using MSVC's ARM64 cross tools, then installed and run
# on GitHub Actions' native windows-11-arm runner.
name: Windows ARM64

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "packaging/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-arm64.yml"
      - "packaging/windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@main
    with:
      app-name: vectorcraft
      app-dir: VectorCraft
